name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenMP (needed by LightGBM on macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install the package with its test and model dependencies
        run: python -m pip install -e ".[dev,models]"
      - name: Check for unused or undefined names
        run: python -m pyflakes src scripts tests
      - name: Run the tests (the real-data checks skip, as the data is not redistributed)
        run: python -m pytest -rs

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pvcal"
version = "1.1.0"
description = "Calibration of day-ahead probabilistic PV forecasts under seasonal shift (GEFCom2014 solar track)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Naren Kaarthik" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.0", "matplotlib"]
keywords = ["probabilistic forecasting", "solar power", "quantile regression", "conformal prediction", "GEFCom2014"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest", "pyflakes"]
# LightGBM's scikit-learn interface (LGBMRegressor) needs scikit-learn installed.
models = ["scikit-learn", "lightgbm", "statsmodels"]

[project.scripts]
pvcal-forecast = "pvcal.forecast:main"

[project.urls]
Repository = "https://github.com/Narenkaarthik/pv-interval-calibration"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
